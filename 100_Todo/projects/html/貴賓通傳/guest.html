<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>畢業典禮貴賓通傳系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ca8a04;
      /* Elegant Gold */
      --primary-hover: #a16207;
      --bg: #f3f4f6;
      /* Soft gray */
      --card-bg: #ffffff;
      --header-bg: #0f172a;
      /* Slate 900 / Navy */
      --text: #111827;
      --text-light: #4b5563;
      --success: #059669;
      --success-light: #d1fae5;
      --success-text: #065f46;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --danger-text: #991b1b;
      --warning: #d97706;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 4px;
      --input-bg: #ffffff;
    }

    /* 自助報到明亮風格 */
    body.self-theme {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      background-image: radial-gradient(circle at top right, rgba(202, 138, 4, 0.08), transparent 600px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Outfit", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 4rem;
      -webkit-font-smoothing: antialiased;
    }

    /* Minimalist Header */
    .header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border);
      color: #ffffff;
      padding: 1.5rem 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--primary);
    }

    .mode-switch {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1rem;
      align-items: center;
    }

    .btn-mode {
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-mode:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-mode.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
      box-shadow: 0 0 12px rgba(202, 138, 4, 0.35);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* Category Bar */
    .category-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding-bottom: 1.25rem;
    }

    .btn-edit-inline {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 0.5rem;
      opacity: 0.5;
      transition: opacity 0.2s;
      vertical-align: middle;
    }

    .btn-edit-inline:hover {
      opacity: 1;
    }

    .btn-delete-inline {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-left: 0.5rem;
      opacity: 0.5;
      transition: opacity 0.2s;
      vertical-align: middle;
    }

    .btn-delete-inline:hover {
      opacity: 1;
      color: var(--danger);
    }

    .btn-star-inline {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      margin-left: 0.25rem;
      vertical-align: middle;
      transition: transform 0.2s;
      outline: none;
    }

    .btn-star-inline:hover {
      transform: scale(1.3);
    }

    .btn-clear-search {
      background: transparent;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 0.5rem;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.2s;
      outline: none;
      display: none;
    }

    .btn-clear-search:hover {
      opacity: 1;
      color: var(--danger);
    }

    .btn-category {
      white-space: nowrap;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-category:hover {
      border-color: var(--text-light);
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-category.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    /* Action Bar */
    .action-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .search-box {
      flex: 1;
      background: var(--card-bg);
      padding: 0.6rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
    }

    .search-box input {
      width: 100%;
      padding: 0.25rem 0.5rem;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      outline: none;
      color: var(--text);
    }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-md);
      width: 3.5rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.4rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    /* Add Form */
    .add-form {
      background: var(--card-bg);
      padding: 1.75rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      display: none;
      box-shadow: var(--shadow-lg);
    }

    .add-form h4 {
      font-size: 1.3rem;
      margin-bottom: 1.25rem;
      font-weight: 600;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1.1rem;
      transition: all 0.3s ease;
      background: var(--input-bg);
      color: var(--text);
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
    }

    .form-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-save {
      flex: 2;
      background: var(--primary);
      color: var(--bg);
      border: none;
      padding: 0.9rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn-save:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-cancel {
      flex: 1;
      background: transparent;
      color: var(--text-light);
      border: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-color: var(--text-light);
    }

    /* Section Titles */
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      margin: 2.5rem 0 1rem 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.35rem;
    }

    /* Guest Cards */
    .guest-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
    }

    .guest-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .guest-card.arrived {
      border-left: 5px solid var(--success);
    }

    .guest-card.introduced {
      opacity: 0.5;
    }

    .guest-info {
      flex: 1;
      min-width: 0;
      padding-right: 1.25rem;
    }

    .guest-info h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      flex-wrap: nowrap; /* prevent icons from wrapping to next line */
      gap: 0.5rem;
      min-width: 0;
      overflow: hidden;
    }

    /* Keep name truncated but on same line; controls stay fixed */
    .guest-name {
      flex: 1 1 auto;
      min-width: 0; /* allow ellipsis */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .guest-controls {
      display: inline-flex;
      gap: 0.25rem;
      align-items: center;
      flex: 0 0 auto; /* don't shrink or wrap */
      margin-left: 0.25rem;
    }

    .guest-info p {
      font-size: 1.05rem;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* Action Buttons */
    .guest-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 95px;
    }

    .btn-action {
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
      width: 100%;
      text-align: center;
    }

    .btn-checkin {
      background: var(--header-bg);
      color: #ffffff;
    }

    .btn-checkin:hover {
      background: #1e293b;
    }

    .btn-undo {
      background: transparent;
      color: var(--danger-text);
      font-size: 0.875rem;
      padding: 0.3rem 0.5rem;
      text-decoration: underline;
      font-weight: 600;
      text-align: center;
    }

    .btn-undo:hover {
      color: var(--danger);
    }

    .btn-intro {
      background: transparent;
      color: var(--warning);
      border-color: var(--warning);
    }

    .btn-intro:hover {
      background: var(--warning);
      color: #ffffff;
    }

    .btn-reintro {
      background: transparent;
      color: var(--text-light);
      border-color: var(--border);
    }

    .btn-reintro:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .badge-arrived {
      background: var(--success-light);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-light);
      font-size: 1rem;
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.01);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2.25rem;
      border-radius: var(--radius-md);
      text-align: center;
      max-width: 90%;
      width: 350px;
      box-shadow: var(--shadow-lg);
    }

    .modal-content h3 {
      font-size: 1.25rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .qr-img {
      width: 200px;
      height: 200px;
      margin: 1.5rem auto;
      display: block;
      border-radius: 8px;
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
    }

    /* Self Check-in View */
    #view-self {
      background: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      margin-top: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #view-self::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(to right, var(--primary), #fb7185);
    }

    #view-self h2 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: var(--primary);
      font-weight: 700;
    }

    #view-self p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: var(--text-light);
    }

    #view-self .form-group {
      text-align: left;
    }

    #view-self .form-group input {
      padding: 0.85rem;
      font-size: 1.1rem;
    }

    #btnSelfSave {
      padding: 0.9rem;
      font-size: 1.15rem;
      border-radius: var(--radius-sm);
      margin-top: 1rem;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="header" id="mainHeader">
    <h1><a href="https://docs.google.com/spreadsheets/d/1bscNLGOfAuYsKH_OGO5N5PZowdMEX_h-hvrjNE6g7Dw?authuser=sshorng%40gmail.com&usp=drive_fs" target="_blank" style="text-decoration: none; color: inherit; cursor: pointer;">🎓</a> 畢業典禮貴賓通傳</h1>
    <div class="mode-switch">
      <button id="btn-reception" class="btn-mode" onclick="switchView('reception')">報到處</button>
      <button id="btn-hall" class="btn-mode" onclick="switchView('hall')">場內模式</button>
      <a href="?mode=self" target="_blank" class="btn-mode" style="text-decoration: none;" title="另開自助報到頁面">自助報到入口 ↗</a>
    </div>
  </div>

  <div class="container">
    <!-- 報到處模式 -->
    <div id="view-reception" style="display: none;">
      <div id="categoryBar" class="category-bar"></div>
      <div class="action-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜尋貴賓姓名或單位..." onkeyup="handleSearchInput()">
          <button id="clearSearchBtn" class="btn-clear-search" onclick="clearSearch()" title="清除搜尋內容">✕</button>
        </div>
        <button class="btn-icon" style="color:var(--success)" onclick="toggleAddForm()" title="現場報到">➕</button>
        <button class="btn-icon" style="color:var(--primary)" onclick="showQRCode()" title="顯示自助報到 QR Code">📱</button>
      </div>

      <div id="addForm" class="add-form">
        <h4 style="margin-bottom:1rem">新增現場貴賓</h4>

        <div class="form-group"><label>單位</label><input type="text" id="newUnit" placeholder="例如：教育局"></div>
        <div class="form-group"><label>職稱</label><input type="text" id="newTitle" placeholder="例如：局長"></div>
        <div class="form-group"><label>姓名</label><input type="text" id="newName" placeholder="請輸入姓名"></div>
        <div class="form-actions">
          <button class="btn-cancel" onclick="toggleAddForm()">取消</button>
          <button id="btnSaveGuest" class="btn-save" onclick="saveNewGuest('reception')">確認新增並報到</button>
        </div>
      </div>
      <div id="guestList" class="list-container">
        <div class="empty-state">讀取名單中...</div>
      </div>
    </div>

    <!-- 場內模式 -->
    <div id="view-hall" style="display: none;">
      <div class="section-title">待介紹貴賓</div>
      <div id="hall-pending" class="list-container">
        <div class="empty-state">目前沒有待介紹貴賓</div>
      </div>
      <div class="section-title">已介紹完畢</div>
      <div id="hall-done" class="list-container">
        <div class="empty-state">尚無介紹紀錄</div>
      </div>
    </div>

    <!-- 貴賓自助模式 -->
    <div id="view-self" style="display: none;">
      <!-- 1. 搜尋與點擊報到區塊 -->
      <div id="self-search-section">
        <h2>貴賓自助報到</h2>
        <p style="color:var(--text-light); margin-bottom:1.5rem">歡迎光臨！請輸入您的「姓名」或「單位」進行搜尋報到：</p>
        <div class="action-bar" style="margin-bottom: 1.5rem;">
          <div class="search-box" style="width: 100%;">
            <input type="text" id="selfSearchInput" placeholder="請輸入姓名或單位搜尋..." onkeyup="renderSelfView()">
          </div>
        </div>
        <div id="selfSearchResultList" class="list-container">
          <div class="empty-state">請輸入您的姓名或單位以搜尋</div>
        </div>
        <button id="btn-show-add-self" class="btn-cancel" style="width:100%; margin-top:1.5rem; border-style: dashed;" onclick="showAddSelfForm()">
          🔍 找不到您的名字？手動新增資料
        </button>
      </div>

      <!-- 2. 手動新增資料區塊 (預設隱藏) -->
      <div id="self-add-section" style="display: none;">
        <h2>新增貴賓資料</h2>
        <p style="color:var(--text-light); margin-bottom:1.5rem">名單中沒有您的資料？請填寫以下資訊完成報到：</p>
        <div class="form-group" style="text-align:left">
          <label>單位</label>
          <input type="text" id="selfUnit" placeholder="例如：XX 國小、教育局">
        </div>
        <div class="form-group" style="text-align:left">
          <label>職稱</label>
          <input type="text" id="selfTitle" placeholder="例如：校長、專員、家長">
        </div>
        <div class="form-group" style="text-align:left">
          <label>姓名</label>
          <input type="text" id="selfName" placeholder="您的姓名">
        </div>
        <div class="form-actions" style="margin-top: 1.5rem;">
          <button class="btn-cancel" style="flex: 1;" onclick="resetSelfView()">返回搜尋</button>
          <button id="btnSelfSave" class="btn-save" style="flex: 2;" onclick="saveNewGuest('self')">送出並完成報到</button>
        </div>
      </div>

      <!-- 3. 報到成功提示區塊 (預設隱藏) -->
      <div id="self-success-section" style="display: none; padding: 2rem 1rem;">
        <div style="font-size: 4rem; margin-bottom: 1rem; color: var(--success);">✅</div>
        <h2 style="color: var(--success); margin-bottom: 0.5rem;">報到成功！</h2>
        <p style="font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--text-light);">
          熱烈歡迎 <strong id="selfSuccessName" style="color: var(--text); font-size: 1.25rem;">貴賓</strong>貴賓 光臨畢業典禮。
        </p>
        <p style="color: var(--text-light); margin-bottom: 2rem;">您的座位與資料已通傳場內人員，請您入座。</p>
        <button class="btn-save" style="max-width: 200px; margin: 0 auto;" onclick="resetSelfView()">下一位報到</button>
      </div>
    </div>
  </div>

  <!-- QR Code 彈窗 -->
  <div id="qrModal" class="modal" onclick="closeQRCode()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3>貴賓自助報到 QR Code</h3>
      <p style="font-size:0.85rem; color:var(--text-light)">請貴賓掃描此碼自行填寫資料</p>
      <div id="qrcode"></div>
      <button class="btn-cancel" style="width:100%" onclick="closeQRCode()">關閉</button>
    </div>
  </div>

  <!-- 編輯貴賓彈窗 -->
  <div id="editModal" class="modal" onclick="closeEditModal()">
    <div class="modal-content" style="width: 400px; text-align: left;" onclick="event.stopPropagation()">
      <h3 style="margin-bottom: 1.25rem; text-align: center;">✏️ 編輯貴賓資料</h3>
      <input type="hidden" id="editOldName">
      <div class="form-group">
        <label>類別</label>
        <select id="editCategory" onchange="checkEditCustomCategory()">
          <!-- 動態載入類別 -->
        </select>
        <input type="text" id="editCategoryCustom" placeholder="請輸入自訂類別" style="display: none; margin-top: 0.5rem;">
      </div>
      <div class="form-group">
        <label>單位</label>
        <input type="text" id="editUnit" placeholder="例如：教育局">
      </div>
      <div class="form-group">
        <label>職稱</label>
        <input type="text" id="editTitle" placeholder="例如：局長">
      </div>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="editName" placeholder="請輸入姓名">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" style="flex: 1;" onclick="closeEditModal()">取消</button>
        <button id="btnSaveEdit" class="btn-save" style="flex: 2;" onclick="saveEditGuest()">確認修改</button>
      </div>
    </div>
  </div>

  <script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbzz8NI334hQ2_KxAgdHyiL3rCvWSX_ebes66hd5yoKZT0gbCNDsLJQRh5d6ykFMeWON/exec';
    let allGuests = [];
    let categories = ['全部'];
    let selectedCategory = '全部';

    function getCategoryColor(cat) {
      if (!cat || cat === '未分類') return '#64748b';
      const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1'];
      let hash = 0;
      for (let i = 0; i < cat.length; i++) hash = cat.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    // 檢查網址參數是否有 mode=self
    const urlParams = new URLSearchParams(window.location.search);
    const isSelfMode = urlParams.get('mode') === 'self';
    if (isSelfMode) {
      document.body.classList.add('self-theme');
    }
    let currentView = isSelfMode ? 'self' : (localStorage.getItem('guestSysView') || 'reception');

    function callGAS(params, callback) {
      const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
      window[callbackName] = function (data) {
        delete window[callbackName];
        document.body.removeChild(script);
        callback(data);
      };
      const script = document.createElement('script');
      const queryString = Object.keys(params).map(key => key + '=' + encodeURIComponent(params[key])).join('&');
      script.src = `${webAppUrl}?${queryString}&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    window.onload = function () {
      switchView(currentView);
      refreshData();
      if (!isSelfMode) {
        setInterval(refreshData, 10000);
      }
    };

    function refreshData() {
      callGAS({ action: 'getGuestList' }, function (guests) {
        allGuests = guests;
        updateCategories();
        renderList();
      });
    }

    function switchView(view) {
      currentView = view;
      if (!isSelfMode) {
        localStorage.setItem('guestSysView', view);
        document.getElementById('btn-reception').classList.toggle('active', view === 'reception');
        document.getElementById('btn-hall').classList.toggle('active', view === 'hall');
        renderCategoryBar();
      }

      document.getElementById('mainHeader').style.display = isSelfMode ? 'none' : 'block';
      document.getElementById('view-reception').style.display = view === 'reception' ? 'block' : 'none';
      document.getElementById('view-hall').style.display = view === 'hall' ? 'block' : 'none';
      document.getElementById('view-self').style.display = view === 'self' ? 'block' : 'none';

      renderList();
    }

    function renderCategoryBar() {
      const bar = document.getElementById('categoryBar');
      if (currentView !== 'reception') { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      bar.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `btn-category ${selectedCategory === cat ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => { selectedCategory = cat; renderCategoryBar(); renderList(); };
        bar.appendChild(btn);
      });
    }

    function renderList() {
      if (currentView === 'reception') renderReception();
      else if (currentView === 'hall') renderHall();
      else if (currentView === 'self') renderSelfView();
    }

    function renderSelfView() {
      const container = document.getElementById('selfSearchResultList');
      if (!container) return;
      const searchTerm = document.getElementById('selfSearchInput').value.trim().toLowerCase();
      
      if (!searchTerm) {
        container.innerHTML = '<div class="empty-state">請輸入您的姓名或單位以搜尋</div>';
        return;
      }
      
      const filtered = allGuests.filter(g => 
        (g.name && g.name.toLowerCase().includes(searchTerm)) || 
        (g.unit && g.unit.toLowerCase().includes(searchTerm))
      );
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">找不到相關貴賓，您可以點選下方按鈕手動新增資料</div>';
        return;
      }
      
      container.innerHTML = '';
      filtered.forEach(guest => {
        const isArrived = guest.status === '已抵達';
        const card = document.createElement('div');
        card.className = `guest-card ${isArrived ? 'arrived' : ''}`;
        card.style.textAlign = 'left';
        card.innerHTML = `
          <div class="guest-info">
            <h3>
              ${guest.name}
              ${isArrived ? `<span class="status-badge badge-arrived">${guest.arrivalTime || '已報到'}</span>` : ''}
            </h3>
            <p>${guest.unit} / ${guest.title}</p>
          </div>
          <div class="guest-actions">
            ${isArrived ? 
              `<button class="btn-action" style="background:#f1f5f9;color:var(--text-light)" disabled>已報到</button>` : 
              `<button class="btn-action btn-checkin" onclick="action('checkIn', '${guest.name.replace(/'/g, "\\'")}', this)">報到</button>`
            }
          </div>`;
        container.appendChild(card);
      });
    }

    function showSelfSuccess(name) {
      document.getElementById('self-search-section').style.display = 'none';
      document.getElementById('self-add-section').style.display = 'none';
      document.getElementById('self-success-section').style.display = 'block';
      document.getElementById('selfSuccessName').innerText = name;
    }

    function resetSelfView() {
      document.getElementById('selfSearchInput').value = '';
      document.getElementById('selfUnit').value = '';
      document.getElementById('selfTitle').value = '';
      document.getElementById('selfName').value = '';
      document.getElementById('self-search-section').style.display = 'block';
      document.getElementById('self-add-section').style.display = 'none';
      document.getElementById('self-success-section').style.display = 'none';
      renderSelfView();
    }

    function showAddSelfForm() {
      document.getElementById('self-search-section').style.display = 'none';
      document.getElementById('self-add-section').style.display = 'block';
      document.getElementById('self-success-section').style.display = 'none';
      const searchTerm = document.getElementById('selfSearchInput').value.trim();
      document.getElementById('selfName').value = searchTerm;
    }

    function renderReception() {
      const container = document.getElementById('guestList');
      const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = allGuests;
      
      if (searchTerm) {
        // 全域搜尋優先，無視分類限制
        filtered = filtered.filter(g => g.name.toLowerCase().includes(searchTerm) || g.unit.toLowerCase().includes(searchTerm));
      } else if (selectedCategory !== '全部') {
        // 無搜尋內容時，才依分類篩選
        filtered = filtered.filter(g => g.category === selectedCategory);
      }

      // 排序邏輯：
      // 1. 未報到且確認出席 (最優先置頂，分數 0)
      // 2. 未報到且未確認出席 (次優先，分數 10)
      // 3. 已報到 (沉底，分數 100)
      filtered.sort((a, b) => {
        const getScore = (g) => {
          if (g.status === '已抵達') return 100;
          if (g.confirmed) return 0;
          return 10;
        };
        return getScore(a) - getScore(b);
      });

      if (filtered.length === 0) { container.innerHTML = '<div class="empty-state">找不到相關貴賓</div>'; return; }
      container.innerHTML = '';
      filtered.forEach(guest => {
        const isArrived = guest.status === '已抵達';
        const card = document.createElement('div');
        card.className = `guest-card ${isArrived ? 'arrived' : ''}`;
        card.innerHTML = `
          <div class="guest-info">
            <h3>
              <span class="cat-tag" style="background-color: ${getCategoryColor(guest.category)}">${guest.category}</span>
              ${guest.name}
              <button class="btn-edit-inline" onclick="openEditModal('${guest.name.replace(/'/g, "\\'")}')" title="編輯貴賓資料">✏️</button>
              <button class="btn-delete-inline" onclick="confirmDeleteGuest('${guest.name.replace(/'/g, "\\'")}')" title="刪除貴賓">🗑️</button>
              <button class="btn-star-inline" onclick="toggleConfirmAction('${guest.name.replace(/'/g, "\\'")}', ${!guest.confirmed}); event.stopPropagation();" title="${guest.confirmed ? '取消確認出席' : '標記確認出席'}">
                ${guest.confirmed ? '⭐' : '☆'}
              </button>
              ${isArrived ? `<span class="status-badge badge-arrived">${guest.arrivalTime}</span>` : ''}
            </h3>
            <p>${guest.unit} / ${guest.title}</p>
          </div>
          <div class="guest-actions">
            ${isArrived ? `<button class="btn-action" style="background:#f1f5f9;color:var(--text-light)" disabled>已報到</button><a href="#" class="btn-undo" onclick="action('undoCheckIn', '${guest.name}', this); return false;">撤銷</a>` : `<button class="btn-action btn-checkin" onclick="action('checkIn', '${guest.name}', this)">報到</button>`}
          </div>`;
        container.appendChild(card);
      });
    }

    function renderHall() {
      const pendingContainer = document.getElementById('hall-pending');
      const doneContainer = document.getElementById('hall-done');
      const pending = allGuests.filter(g => g.status === '已抵達' && g.introStatus !== '已介紹');
      const done = allGuests.filter(g => g.status === '已抵達' && g.introStatus === '已介紹');
      pendingContainer.innerHTML = pending.length === 0 ? '<div class="empty-state">目前沒有待介紹貴賓</div>' : '';
      doneContainer.innerHTML = done.length === 0 ? '<div class="empty-state">尚無介紹紀錄</div>' : '';
      pending.forEach(g => pendingContainer.appendChild(createHallCard(g, 'markAsIntroduced', '已介紹', 'btn-intro')));
      done.forEach(g => { const div = createHallCard(g, 'undoIntro', '還原', 'btn-reintro'); div.classList.add('introduced'); doneContainer.appendChild(div); });
    }

    function createHallCard(guest, act, label, btnClass) {
      const div = document.createElement('div');
      div.className = 'guest-card arrived';
      div.innerHTML = `<div class="guest-info"><h3><span class="cat-tag" style="background-color: ${getCategoryColor(guest.category)}">${guest.category}</span>${guest.name} <span class="status-badge badge-arrived">${guest.arrivalTime}</span></h3><p>${guest.unit} / ${guest.title}</p></div><div class="guest-actions"><button class="btn-action ${btnClass}" onclick="action('${act}', '${guest.name}', this)">${label}</button></div>`;
      return div;
    }

    function action(act, name, btn) {
      // 樂觀 UI 更新 (Optimistic Update) - 讓使用者感覺「秒更新」
      const guest = allGuests.find(g => g.name === name);
      let backupStatus, backupTime, backupIntro;

      if (guest) {
        // 備份原狀態以防失敗還原
        backupStatus = guest.status;
        backupTime = guest.arrivalTime;
        backupIntro = guest.introStatus;

        // 立即更新本地資料
        if (act === 'checkIn') {
          guest.status = '已抵達';
          const d = new Date();
          guest.arrivalTime = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
        } else if (act === 'undoCheckIn') {
          guest.status = '未抵達';
          guest.arrivalTime = '';
          guest.introStatus = '未介紹';
        } else if (act === 'markAsIntroduced') {
          guest.introStatus = '已介紹';
        } else if (act === 'undoIntro') {
          guest.introStatus = '未介紹';
        }

        // 立即重新渲染畫面
        renderList();
      } else {
        // 例外狀況退回轉圈圈
        if (btn.tagName === 'BUTTON') { btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>'; }
      }

      // 在背景悄悄發送請求給 Google Sheets
      callGAS({ action: act, name: name }, function (res) {
        if (!res.success) {
          // 如果真的失敗了，把畫面還原並警告
          if (guest) {
            guest.status = backupStatus;
            guest.arrivalTime = backupTime;
            guest.introStatus = backupIntro;
            renderList();
          }
          alert('操作失敗，請檢查網路：' + res.message);
        } else {
          if (currentView === 'self' && act === 'checkIn') {
            showSelfSuccess(name);
          }
        }
      });
    }

    function saveNewGuest(type) {
      const prefix = type === 'self' ? 'self' : 'new';
      const name = document.getElementById(prefix + 'Name').value;
      const unit = document.getElementById(prefix + 'Unit').value;
      const title = document.getElementById(prefix + 'Title').value;
      const cat = '現場';

      const btn = document.getElementById(type === 'self' ? 'btnSelfSave' : 'btnSaveGuest');

      if (!name) { alert('請輸入姓名'); return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span>處理中...';

      callGAS({ action: 'addGuest', category: cat, unit: unit, title: title, name: name }, function (res) {
        if (res.success) {
          if (type === 'self') {
            showSelfSuccess(name);
            document.getElementById('selfName').value = '';
            document.getElementById('selfUnit').value = '';
            document.getElementById('selfTitle').value = '';
            btn.disabled = false;
            btn.innerHTML = '送出並完成報到';
            refreshData();
          } else {
            document.getElementById('newName').value = ''; document.getElementById('newUnit').value = ''; document.getElementById('newTitle').value = '';
            toggleAddForm(); refreshData();
            btn.disabled = false; btn.innerHTML = '確認新增並報到';
          }
        } else {
          alert('報到失敗：' + res.message);
          btn.disabled = false; btn.innerHTML = type === 'self' ? '送出並完成報到' : '確認新增並報到';
        }
      });
    }

    function updateCategories() {
      const uniqueCats = [...new Set(allGuests.map(g => g.category))].filter(c => c && c !== '未分類');
      categories = ['全部', ...uniqueCats];
      renderCategoryBar();

      // 更新下拉選單
      const select = document.getElementById('newCategory');
      if (select) {
        select.innerHTML = uniqueCats.map(c => `<option value="${c}">${c}</option>`).join('');
        if (!uniqueCats.includes('現場')) select.innerHTML += `<option value="現場">現場</option>`;
        select.innerHTML += `<option value="custom">➕ 自訂新類別...</option>`;
      }
    }

    function toggleAddForm() { const form = document.getElementById('addForm'); form.style.display = form.style.display === 'block' ? 'none' : 'block'; }

    function showQRCode() {
      const selfUrl = window.location.href.split('?')[0] + '?mode=self';
      document.getElementById('qrcode').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(selfUrl)}" class="qr-img">`;
      document.getElementById('qrModal').style.display = 'flex';
    }
    function closeQRCode() { document.getElementById('qrModal').style.display = 'none'; }

    function openEditModal(name) {
      const guest = allGuests.find(g => g.name === name);
      if (!guest) return;
      
      document.getElementById('editOldName').value = guest.name;
      document.getElementById('editName').value = guest.name;
      document.getElementById('editUnit').value = guest.unit || '';
      document.getElementById('editTitle').value = guest.title || '';
      
      // 動態更新編輯下拉選單中的類別
      const uniqueCats = [...new Set(allGuests.map(g => g.category))].filter(c => c && c !== '未分類');
      const select = document.getElementById('editCategory');
      if (select) {
        select.innerHTML = uniqueCats.map(c => `<option value="${c}">${c}</option>`).join('');
        if (!uniqueCats.includes('現場')) select.innerHTML += `<option value="現場">現場</option>`;
        select.innerHTML += `<option value="custom">➕ 自訂新類別...</option>`;
        select.value = guest.category;
      }
      
      // 重設自訂類別輸入框
      const customInput = document.getElementById('editCategoryCustom');
      if (customInput) {
        customInput.value = '';
        customInput.style.display = 'none';
      }
      
      document.getElementById('editModal').style.display = 'flex';
    }

    function checkEditCustomCategory() {
      const select = document.getElementById('editCategory');
      const customInput = document.getElementById('editCategoryCustom');
      if (select && customInput) {
        if (select.value === 'custom') {
          customInput.style.display = 'block';
          customInput.focus();
        } else {
          customInput.style.display = 'none';
        }
      }
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveEditGuest() {
      const oldName = document.getElementById('editOldName').value;
      const name = document.getElementById('editName').value.trim();
      const unit = document.getElementById('editUnit').value.trim();
      const title = document.getElementById('editTitle').value.trim();
      
      let cat = '現場';
      const select = document.getElementById('editCategory');
      if (select) {
        cat = select.value;
        if (cat === 'custom') {
          cat = document.getElementById('editCategoryCustom').value.trim() || '現場';
        }
      }
      
      if (!name) { alert('請輸入姓名'); return; }
      
      const btn = document.getElementById('btnSaveEdit');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span>儲存中...';
      
      callGAS({
        action: 'editGuest',
        oldName: oldName,
        category: cat,
        unit: unit,
        title: title,
        name: name
      }, function(res) {
        btn.disabled = false;
        btn.innerHTML = '確認修改';
        if (res.success) {
          closeEditModal();
          refreshData();
        } else {
          alert('修改失敗：' + res.message);
        }
      });
    }

    function toggleConfirmAction(name, isConfirmed) {
      const guest = allGuests.find(g => g.name === name);
      if (guest) {
        const backupConfirmed = guest.confirmed;
        guest.confirmed = isConfirmed;
        renderList();
        
        callGAS({ action: 'toggleConfirm', name: name, isConfirmed: isConfirmed }, function(res) {
          if (!res.success) {
            guest.confirmed = backupConfirmed;
            renderList();
            alert('設定失敗：' + res.message);
          }
        });
      }
    }

    function handleSearchInput() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (input && clearBtn) {
        clearBtn.style.display = input.value.trim() ? 'block' : 'none';
      }
      renderList();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (input) {
        input.value = '';
        if (clearBtn) {
          clearBtn.style.display = 'none';
        }
        renderList();
        input.focus(); // 清除後自動聚焦，方便使用者繼續輸入！
      }
    }

    function confirmDeleteGuest(name) {
      if (confirm(`確定要刪除貴賓「${name}」嗎？此操作將無法復原，該筆資料將會被永久移除。`)) {
        // 樂觀 UI：先從本地名單移除並渲染
        const index = allGuests.findIndex(g => g.name === name);
        let backupGuest = null;
        if (index > -1) {
          backupGuest = allGuests[index];
          allGuests.splice(index, 1);
          renderList();
        }
        
        callGAS({ action: 'deleteGuest', name: name }, function(res) {
          if (!res.success) {
            // 失敗時還原
            if (backupGuest) {
              allGuests.splice(index, 0, backupGuest);
              renderList();
            }
            alert('刪除失敗：' + res.message);
          } else {
            refreshData();
          }
        });
      }
    }
  </script>
</body>

</html>
